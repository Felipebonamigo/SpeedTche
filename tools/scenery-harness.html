<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>scenery-harness</title>
<!-- Cópia do render-harness.html que, no quadro de captura, mede o cenário isolado (com e sem o grupo "scenery"); ver tools/scenery-harness.mjs e docs/VISUAL.md. -->
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#game{position:fixed;inset:0;width:100vw;height:100vh;display:block}#hud{position:fixed;inset:0}</style>
</head><body><canvas id="game"></canvas><div id="hud"></div>
<script type="module">
import { createRace, stepRace, getTrack, CARS, formatTicks } from '../src/core/index.ts';
import { seatColor } from '../src/core/data/drivers.ts';
import { createRenderer } from '../src/render/renderer.ts';
import { setLanguage, t } from '../src/i18n/index.ts';
import * as THREE from 'three';
import '../src/i18n/core.ts';

const q = new URLSearchParams(location.search);
const trackId = q.get('track') ?? 'copacabana';
const humanCount = Math.min(4, Math.max(1, Number(q.get('humans') ?? 1)));
const idle = q.get('idle') === '1';
const preTicks = Number(q.get('ticks') ?? 1500);
const quality = q.get('q') ?? 'high';
const forceNitro = q.get('nitro') === '1';
const forceSkid = q.get('skid') === '1';
// carview=side|rear34|front34|rear: câmera extra num carro parado; showroom=1: os 4 carros lado a lado.
const carview = q.get('carview');
const showroom = q.get('showroom') === '1';
const forcePause = q.get('pause') === '1' || carview !== null || showroom;
const lang = q.get('lang') ?? 'pt';
const speedMul = Number(q.get('speed') ?? 1);
const seq = q.get('seq') === '1';
const readyAt = Number(q.get('frames') ?? 14);
setLanguage(lang);

const track = getTrack(trackId);
const humans = Array.from({ length: humanCount }, (_, i) => ({ seat: i, name: `P${i + 1}`, carId: CARS[i % CARS.length].id, teamId: 0, color: seatColor(i) }));
const state = createRace({ trackId, laps: track.def.laps, humans, totalCars: 20, difficulty: 'profissional', manualGear: false, assists: { sharedNitro: true, tow: true, teamDraft: true, catchup: true }, seed: 42 }, track);
// Humanos em piloto automático (mesmo truque do scripts/smoke.ts): com `ai` preenchido, stepRace dirige por eles.
for (const c of state.cars) if (c.seat >= 0) c.ai = { skill: 0.97, laneX: 0.2 * (c.seat - 1.5), laneUntil: 0, lookahead: 28, aggression: 0.6 };

const messages = new Map(humans.map((h) => [h.seat, []]));
function push(seat, text, kind, ttl) { const l = messages.get(seat); if (!l) return; if (kind === 'big') for (let i = l.length - 1; i >= 0; i--) if (l[i].kind === 'big') l.splice(i, 1); l.push({ text, kind, ttl }); }
function handle(e) {
  const laps = state.config.laps;
  if (e.type === 'countdown') for (const s of messages.keys()) push(s, String(e.value), 'big', 0.9);
  if (e.type === 'go') for (const s of messages.keys()) push(s, t('hud.go'), 'big', 0.8);
  if (!('carId' in e)) return;
  const car = state.cars[e.carId]; if (!car || car.seat < 0) return;
  if (e.type === 'lap' && e.lap <= laps) push(car.seat, e.lap === laps ? t('hud.lastLap') : t('hud.lapOf', { n: e.lap, total: laps }), 'big', 1.5);
  if (e.type === 'lap' && e.best && e.lap > 2) push(car.seat, `${t('hud.best')} ${formatTicks(e.lapTicks)}`, 'good', 2);
  if (e.type === 'fuel_low') push(car.seat, t('hud.lowFuel'), 'warn', 3);
  if (e.type === 'pit_enter') push(car.seat, t('hud.pitStop'), 'info', 2);
  if (e.type === 'nitro_denied') push(car.seat, t('hud.noNitro'), 'warn', 0.8);
  if (e.type === 'finish') push(car.seat, `${t('hud.finished')} ${e.position}º`, 'big', 4);
}
function tick() { stepRace(state, track, []); for (const e of state.events) handle(e); }
function ageMessages(dt) { for (const l of messages.values()) for (let i = l.length - 1; i >= 0; i--) { l[i].ttl -= dt; if (l[i].ttl <= 0) l.splice(i, 1); } }
for (let i = 0; i < preTicks; i++) { tick(); ageMessages(1 / 60); }
if (carview !== null || showroom) {
  const me = state.cars.find((c) => c.seat === 0);
  for (const c of state.cars) { c.speed = 0; c.nitroTicks = 0; c.skidTicks = 0; c.steerPose = 0; }
  if (showroom) {
    const ids = ['falcao', 'trovao', 'tornado', 'camelo'];
    const chosen = ids.map((id) => (me.carId === id ? me : state.cars.find((c) => c.carId === id && c !== me)));
    // Sem carro daquela cor no grid? Empresta um da IA (só visual: o carId muda a cor).
    chosen.forEach((c, i) => { if (!c) { const spare = state.cars.find((x) => x !== me && !chosen.includes(x)); if (spare) { spare.carId = ids[i]; chosen[i] = spare; } } });
    for (const c of state.cars) if (!chosen.includes(c)) c.z = (me.z + track.length / 2) % track.length;
    chosen.forEach((c, i) => { if (c) { c.z = me.z; c.x = [-0.78, -0.26, 0.26, 0.78][i]; } });
  } else {
    for (const c of state.cars) if (c !== me) c.z = (me.z + track.length / 2) % track.length;
    me.x = 0;
  }
  if (forceNitro) for (const c of state.cars) c.nitroTicks = 100;
}
if (q.get('msg')) { for (const s of messages.keys()) { push(s, q.get('msg'), 'big', 9); push(s, t('hud.lowFuel'), 'warn', 9); push(s, t('hud.pitStop'), 'info', 9); } }

const canvas = document.getElementById('game');
const hud = document.getElementById('hud');
const renderer = createRenderer(canvas, hud);
function resize() { renderer.resize(window.innerWidth, window.innerHeight, Number(q.get('dpr') ?? 1)); }
window.addEventListener('resize', resize); resize();

let frames = 0; let time = 0; let last = performance.now();
const extraCam = carview !== null || showroom ? new THREE.PerspectiveCamera(38, 1, 0.1, 4000) : null;
const VIEWS = { side: [[-7.6, 1.25, 0.3], [0, 0.55, 0]], rear34: [[5.4, 2.0, 7.0], [0, 0.6, 0.4]], front34: [[-6.4, 1.9, -7.4], [0, 0.6, 0]], rear: [[0, 1.5, 8.6], [0, 0.6, 0]] };
function renderExtra() {
  const gl = renderer.__gl; const scene = renderer.__scene;
  const v = VIEWS[carview || 'rear34'] ?? VIEWS.rear34;
  const k = showroom ? 2.1 : 1;
  extraCam.aspect = innerWidth / innerHeight; extraCam.updateProjectionMatrix();
  extraCam.position.set(v[0][0] * k, v[0][1] * k, v[0][2] * k);
  extraCam.lookAt(v[1][0], v[1][1], v[1][2]);
  gl.setViewport(0, 0, innerWidth, innerHeight); gl.setScissor(0, 0, innerWidth, innerHeight);
  gl.render(scene, extraCam);
}
window.ready = false;
window.errors = [];
window.addEventListener('error', (e) => window.errors.push(String(e.message)));
function loop(now) {
  const dt = q.get('realtime') === '1' ? Math.min(0.1, (now - last) / 1000) : 1 / 60; last = now; time += dt;
  // seq: 4 quadros de corrida, 4 de fundo de menu, 4 de corrida (o jogo alterna entre os dois).
  const idleNow = idle || (seq && frames >= 4 && frames < 8);
  if (!idleNow) {
    if (!forcePause) for (let k = 0; k < speedMul; k++) tick();
    for (const c of state.cars) if (c.seat >= 0) { if (forceNitro) c.nitroTicks = 100; if (forceSkid) { c.x = 1.35; c.skidTicks = 6; } }
    ageMessages(dt);
    const viewports = humans.map((h) => ({ seat: h.seat, carIndex: state.cars.findIndex((c) => c.seat === h.seat), color: h.color, name: h.name, messages: messages.get(h.seat) }));
    renderer.render({ state, track, viewports, options: { quality, showMinimap: q.get('map') !== '0', screenShake: true }, time, paused: forcePause, coop: humanCount >= 2, showHud: q.get('hud') !== '0' && !extraCam });
    if (extraCam) renderExtra();
  } else {
    renderer.renderIdle(Number(q.get('t') ?? 0) + time, track);
  }
  frames++;
  if (frames === readyAt) {
    // Mede o cenário isolado: o mesmo quadro de novo, com e sem o grupo que tem mais InstancedMesh.
    const scene = renderer.__scene; const gl = renderer.__gl;
    let scen = scene.getObjectByName('scenery') ?? null; let best = -1;
    if (!scen) scene.traverse((o) => { if (o.isGroup) { const n = o.children.filter((c) => c.isInstancedMesh).length; if (n > best) { best = n; scen = o; } } });
    const again = () => {
      const viewports = humans.map((h) => ({ seat: h.seat, carIndex: state.cars.findIndex((c) => c.seat === h.seat), color: h.color, name: h.name, messages: messages.get(h.seat) }));
      if (idle) renderer.renderIdle(Number(q.get('t') ?? 0) + time, track);
      else renderer.render({ state, track, viewports, options: { quality, showMinimap: q.get('map') !== '0', screenShake: true }, time, paused: false, coop: humanCount >= 2, showHud: q.get('hud') !== '0' });
      return renderer.debugInfo();
    };
    const withS = again();
    scen.visible = false;
    const without = again();
    scen.visible = true;
    const final = again();
    let inst = 0; let tris = 0; let live = 0;
    for (const c of scen.children) {
      if (c.isInstancedMesh && c.visible && c.count > 0) { live++; inst += c.count; const g = c.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3 * c.count; }
      if (c.isBatchedMesh && c.visible) { live++; let v = 0; for (let k = 0; k < c._multiDrawCount; k++) v += c._multiDrawCounts[k]; inst += c._multiDrawCount; tris += v / 3; }
    }
    window.debug = { calls: final.calls, triangles: final.triangles, geometries: gl.info.memory.geometries, textures: gl.info.memory.textures, programs: gl.info.programs.length,
      scenery: { calls: withS.calls - without.calls, triangles: withS.triangles - without.triangles, meshes: scen.children.length, liveMeshesLastVp: live, instancesLastVp: inst, trisLastVp: Math.round(tris) } };
    window.ready = true; return;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.nc = { state, track, renderer };
</script></body></html>
