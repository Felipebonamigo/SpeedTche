<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>conversor de marcos</title>
<style>html,body{margin:0;background:#1b2330;overflow:hidden;font:13px system-ui,sans-serif}canvas{display:block}
.lb{position:absolute;color:#fff;background:rgba(0,0,0,.6);padding:3px 7px;border-radius:3px;white-space:nowrap}</style>
</head><body>
<script type="module">
// Página do conversor de marcos baixados (tools/convert-landmark.mjs a abre no Chromium sem janela, com um servidor
// do Vite). window.convert(opts): lê o arquivo de /__entrada__, converte (scripts/lib/landmark-convert.ts), confere com
// o MESMO leitor do jogo (landmarks/gltf.ts) e desenha a prévia: em cima o original (com a textura), embaixo o
// convertido, de três lados. window.makeSynthetic(detalhe): o modelo sintético de prova, em .glb.
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { convertLandmark, TARGET_TRIS } from '../scripts/lib/landmark-convert.ts';
import { syntheticLandmark } from '../scripts/lib/synthetic-landmark.ts';
import { exportGlb } from '../src/render/cars/template.ts';
import { modelBounds, LANDMARK_PREFIX } from '../src/render/scenery/catalog.ts';
import { LANDMARKS } from '../src/render/scenery/landmarks/index.ts';
import { parseLandmarkGlb } from '../src/render/scenery/landmarks/gltf.ts';
import { landmarkScene } from '../src/render/scenery/landmarks/template.ts';

function toBase64(buf) {
  const bytes = new Uint8Array(buf); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

/** Pixels de uma textura: os dados (DataTexture) ou a imagem desenhada num canvas. */
function readPixels(tex) {
  const img = tex.image;
  if (!img) return null;
  if (img.data && img.width) return { width: img.width, height: img.height, data: img.data };
  const w = img.width; const h = img.height;
  if (!w || !h) return null;
  const c = new OffscreenCanvas(w, h);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);
  return { width: w, height: h, data: ctx.getImageData(0, 0, w, h).data };
}

window.makeSynthetic = async (detail = 1) => {
  const root = syntheticLandmark(detail);
  let tris = 0;
  root.traverse((o) => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  return { glb: toBase64(await exportGlb(root)), triangles: tris };
};

const W = 1200; const H = 820; const ROW = (H - 20) / 2;
const VIEWS = [['de frente (+X, a pista)', 0, 0.12], ['chegando (3/4)', 0.75, 0.22], ['de trás (3/4)', Math.PI + 0.75, 0.22]];

function lights(scene) {
  scene.add(new THREE.HemisphereLight('#9fd0ff', '#3a6a2a', 0.9));
  const sun = new THREE.DirectionalLight('#fff3d8', 2.6); sun.position.set(60, 90, 40); scene.add(sun);
}

function preview(original, matrix, model, report, title) {
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.setScissorTest(true);
  document.body.appendChild(renderer.domElement);
  const top = new THREE.Scene(); top.background = new THREE.Color('#8fc8f0'); lights(top);
  const holder = new THREE.Group(); holder.matrixAutoUpdate = false; holder.matrix.copy(matrix); holder.add(original); top.add(holder);
  const bottom = new THREE.Scene(); bottom.background = new THREE.Color('#8fc8f0'); lights(bottom);
  const mats = {
    flat: new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.86, side: THREE.DoubleSide }),
    glow: new THREE.MeshBasicMaterial({ vertexColors: true, color: new THREE.Color().setScalar(0.95) }),
  };
  for (const p of model.parts) bottom.add(new THREE.Mesh(p.geometry, mats[p.mat] ?? mats.flat));
  const b = report.bounds;
  const centre = new THREE.Vector3(0, (b.maxY - b.minY) * 0.45, 0);
  const radius = 0.5 * Math.hypot(b.maxX - b.minX, b.maxY - b.minY, b.maxZ - b.minZ);
  const cam = new THREE.PerspectiveCamera(32, (W / 3) / ROW, 0.1, radius * 20);
  const dist = (radius / Math.sin((32 * Math.PI) / 360)) * 0.85;
  const label = (text, x, y) => { const d = document.createElement('div'); d.className = 'lb'; d.textContent = text; d.style.left = `${x + 6}px`; d.style.top = `${y + 6}px`; document.body.appendChild(d); };
  VIEWS.forEach(([name, az, el], i) => {
    cam.position.set(centre.x + Math.cos(az) * Math.cos(el) * dist, centre.y + Math.sin(el) * dist, centre.z + Math.sin(az) * Math.cos(el) * dist);
    cam.lookAt(centre);
    for (const [scene, row] of [[top, 0], [bottom, 1]]) {
      const x = (i * W) / 3; const yTop = 20 + row * ROW;
      renderer.setViewport(x, H - yTop - ROW, W / 3, ROW); renderer.setScissor(x, H - yTop - ROW, W / 3, ROW);
      renderer.render(scene, cam);
      if (i === 0) label(row === 0 ? `original · ${report.trianglesIn.toLocaleString('pt-BR')} triângulos` : `convertido · ${report.trianglesOut.toLocaleString('pt-BR')} triângulos · ${report.palette.length} cores`, x, yTop);
      if (row === 1) label(name, x, yTop + ROW - 30);
    }
  });
  const head = document.createElement('div'); head.className = 'lb'; head.style.left = '0'; head.style.top = '0'; head.style.right = '0'; head.style.borderRadius = '0';
  head.textContent = title; document.body.appendChild(head);
  // Paleta: amostras no canto da linha de baixo.
  report.palette.forEach((p, i) => {
    const d = document.createElement('div');
    d.style.cssText = `position:absolute;width:22px;height:22px;right:${8 + i * 26}px;top:${26 + ROW}px;background:${p.hex};border:2px solid ${p.glow ? '#fff36a' : 'rgba(0,0,0,.4)'}`;
    document.body.appendChild(d);
  });
}

window.convert = async (opts) => {
  const buf = await (await fetch('/__entrada__')).arrayBuffer();
  const gltf = await new GLTFLoader().parseAsync(buf, '');
  const def = Object.prototype.hasOwnProperty.call(LANDMARKS, opts.id) ? LANDMARKS[opts.id] : null;
  const place = opts.place ?? def?.place;
  if (!place) throw new Error(`"${opts.id}" não é um marco registrado: diga o lugar (--place near|far|skyline)`);
  const o = { ...opts, place };
  // Sem altura nem escala: a do marco procedural do mesmo id (o arquivo entra do tamanho do que substitui).
  if (o.height === undefined && o.scale === undefined && def) o.height = modelBounds(LANDMARK_PREFIX + opts.id).maxY;
  if (o.glowMaterials) o.glowMaterials = new RegExp(o.glowMaterials, 'i');
  const source = gltf.scene;
  const { model, report, matrix } = await convertLandmark(source, readPixels, o);
  report.id = opts.id;
  report.height = o.height ?? null;
  report.defaultTarget = TARGET_TRIS[place];
  const glb = await exportGlb(landmarkScene(model, opts.id));
  // A prova: o arquivo gravado volta pelo leitor do jogo e passa no validador.
  const back = await parseLandmarkGlb(place, glb);
  report.problems = back.model ? back.problems : back.problems.length ? back.problems : ['o arquivo convertido não voltou pelo leitor do jogo'];
  report.warnings = [...report.warnings, ...back.warnings];
  report.bytes = glb.byteLength;
  preview(source, matrix, model, report, `${opts.id} · ${place} · ${report.method} · altura ${(report.bounds.maxY).toFixed(1)} m · pegada ${(report.bounds.maxX - report.bounds.minX).toFixed(1)} × ${(report.bounds.maxZ - report.bounds.minZ).toFixed(1)} m${report.problems.length ? ' · RECUSADO' : ''}`);
  return { glb: toBase64(glb), report };
};
window.ready = true;
</script></body></html>
