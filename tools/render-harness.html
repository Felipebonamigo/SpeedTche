<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>render-harness</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#game{position:fixed;inset:0;width:100vw;height:100vh;display:block}#hud{position:fixed;inset:0}#sheet{position:fixed;inset:0;width:100vw;height:100vh;display:none;z-index:10}</style>
</head><body><canvas id="game"></canvas><div id="hud"></div><canvas id="sheet"></canvas>
<script type="module">
import { createRace, stepRace, getTrack, CARS, formatTicks } from '../src/core/index.ts';
import { CAR_BODIES } from '../src/core/data/cars.ts';
import { seatColor } from '../src/core/data/drivers.ts';
import { PAINT_IDS, paintsOfLooks, raceLooks } from '../src/game/paints.ts';
import { FINISH_IDS, FLAME_IDS, RIM_IDS, STRIPE_IDS, WHEEL_IDS, WHEEL_LISTS } from '../src/game/cosmetics.ts';
import { createRenderer } from '../src/render/renderer.ts';
import { loadCarAssets } from '../src/render/cars/assets.ts';
import { loadLandmarkAssets, loadLandmarkParts } from '../src/render/scenery/landmarks/assets.ts';
import { setLanguage, t } from '../src/i18n/index.ts';
import * as THREE from 'three';
import '../src/i18n/core.ts';
import '../src/ui/strings.ts';

const q = new URLSearchParams(location.search);
const trackId = q.get('track') ?? 'copacabana';
const humanCount = Math.min(4, Math.max(1, Number(q.get('humans') ?? 1)));
const idle = q.get('idle') === '1';
const preTicks = Number(q.get('ticks') ?? 1500);
const quality = q.get('q') ?? 'high';
const forceNitro = q.get('nitro') === '1';
const forceSkid = q.get('skid') === '1';
// drift=1|-1: o carro do jogador derrapa para a direita (1) ou a esquerda (-1) (guinada visual, M4); hit=<quadro>: no quadro dado o carro do
// jogador "bate" (queda de 40% da velocidade e collisionCooldown = 20), para ver o rodopio, o quique e as estrelinhas; frames=<n> escolhe o instante.
const forceDrift = Number(q.get('drift') ?? 0);
const hitFrame = q.get('hit') === null ? -1 : Number(q.get('hit'));
// M5 (efeitos): driftlevel=1|2|3 dá carga ao drift=… (faíscas azul, laranja, roxa); top=<fração> prende a velocidade do jogador (top=1: pé no fundo, linhas de
// velocidade; 0.95: tremor); draft=1 põe um carro rápido logo à frente (túnel de ar do vácuo); reduce=1 liga "reduzir efeitos"; ticks=<n> escolhe quando a
// corrida está (ticks=205: a largada vai acontecer nos primeiros quadros).
const driftLevelForced = Number(q.get('driftlevel') ?? 0);
const topForced = Number(q.get('top') ?? 0);
const draftForced = q.get('draft') === '1';
const reduceFx = q.get('reduce') === '1';
// cartoon=1: a opção "Efeitos de cartum" (V8: POW, estrelinhas, rodopio e squash & stretch na batida; o padrão é a batida realista).
const cartoonFx = q.get('cartoon') === '1';
// win=<segundos>: o carro do jogador cruzou a linha em 1º há tantos segundos (a órbita da vitória da câmera, M5).
// nitroat=<quadro>: o nitro engata nesse quadro (nitro=1 o liga desde o 1º, e o 1º quadro só guarda o estado: sem anel de engate).
const nitroAt = Number(q.get('nitroat') ?? -1);
const winSeconds = q.get('win') === null ? -1 : Number(q.get('win'));
// carview=side|rear34|front34|rear|front: câmera extra num carro parado (body=<estilo> ou car=<id> escolhe o carro);
// showroom=1: os 13 estilos em grade na pista (carview escolhe o lado, padrão front34);
// sheet=side|rear34|front34|rear: folha de contato com os 13 estilos (e o 2º GT) em quadros;
// ghost=1: fantasma do contra-relógio ao lado do carro do jogador; brake=1: lanternas de freio acesas.
// paints=<id>,<id>…: pintura de cada humano (P1, P2…; ids de src/game/paints.ts; vazio = Original), como a sessão monta;
// paintsheet=<carro>: folha de contato com o carro nas 16 pinturas da paleta (carview escolhe a vista, padrão front34).
// looksheet=finish|wheel|wheelall|stripe|rim|flame (N3; wheelall = os 9 desenhos, sem a lista do estilo): folha de contato com o carro (car=<id>, padrão falcao) em cada acabamento / roda da lista do estilo /
// faixa / cor de aro / cor de chama (a chama pede nitro=1); lookbase={"paint":"rubi",…} é o look de partida de todos os quadros (JSON); q=medium|high.
// looks=<json>;<json>…: o look de cada humano (P1, P2…), como a sessão monta.
// tod=day|dusk|night: o mesmo trecho em outro período (só aparência; cópia — o cache do getTrack não muda).
const carview = q.get('carview');
const showroom = q.get('showroom') === '1';
const paintSheet = q.get('paintsheet');
const lookSheet = q.get('looksheet');
const sheet = q.get('sheet') ?? (paintSheet || lookSheet ? (q.get('carview') ?? 'front34') : null);
const ghostOn = q.get('ghost') === '1';
const forcePause = q.get('pause') === '1' || carview !== null || showroom || sheet !== null;
const lang = q.get('lang') ?? 'pt';
const speedMul = Number(q.get('speed') ?? 1);
const seq = q.get('seq') === '1';
const readyAt = Number(q.get('frames') ?? 14);
// live=<0..1> (M6): a fração da corrida do líder (a corrida que muda: o período anda na última volta); só o `progress` que o renderizador lê, o resto da cena não mexe.
const liveFraction = q.get('live') === null ? -1 : Number(q.get('live'));
setLanguage(lang);

// Estilos sem carro nos dados (os carros novos são de outra tarefa): um carro de demonstração só no
// harness, com a cor abaixo, para o showroom mostrar os 13 modelos.
const DEMO_COLORS = { classic: '#2e7d4f', wedge: '#e53935', pickup: '#1565c0', prototype: '#f4f4f4', micro: '#ffb300', roadster: '#c62828' };
function carForBody(body) {
  let def = CARS.find((c) => c.body === body);
  if (!def) {
    def = { ...CARS[0], id: `demo_${body}`, name: body, body, color: DEMO_COLORS[body] ?? '#888888', price: 0 };
    delete def.accent;
    CARS.push(def);
  }
  return def.id;
}
const styleCars = CAR_BODIES.map(carForBody);

const baseTrack = getTrack(trackId);
const tod = ['day', 'dusk', 'night'].includes(q.get('tod')) ? q.get('tod') : null;
// scenery=<bioma> (M2): troca o bioma da pista só para ver as combinações que nenhuma pista usa (tropical/deserto/montanha/savana à noite, cidade de dia).
const scenery = ['tropical', 'desert', 'city_night', 'alpine', 'coast', 'savanna'].includes(q.get('scenery')) ? q.get('scenery') : null;
const track = tod || scenery ? { ...baseTrack, def: { ...baseTrack.def, ...(tod ? { timeOfDay: tod } : {}), ...(scenery ? { scenery } : {}) } } : baseTrack;
const paintIds = (q.get('paints') ?? '').split(',');
const lookJson = (q.get('looks') ?? '').split(';');
const humans = Array.from({ length: humanCount }, (_, i) => ({ seat: i, name: `P${i + 1}`, carId: CARS[i % 8].id, teamId: 0, color: seatColor(i), ...(lookJson[i] ? { look: JSON.parse(lookJson[i]) } : paintIds[i] ? { look: { paint: paintIds[i] } } : {}) }));
// A config vai sem o visual (como na sessão: o estado da corrida não carrega cosmético).
const state = createRace({ trackId, laps: track.def.laps, humans: humans.map(({ look, ...h }) => h), totalCars: 20, difficulty: 'profissional', manualGear: false, assists: { sharedNitro: true, tow: true, teamDraft: true, catchup: true }, seed: 42 }, track);
/** Folha de pinturas/visuais: o look do carro do jogador neste quadro (null = o de fábrica; undefined = vale o que a sessão montaria). */
let sheetLook;
// Humanos em piloto automático (mesmo truque do scripts/smoke.ts): com `ai` preenchido, stepRace dirige por eles.
for (const c of state.cars) if (c.seat >= 0) c.ai = { skill: 0.97, laneX: 0.2 * (c.seat - 1.5), laneUntil: 0, lookahead: 28, aggression: 0.6 };

const messages = new Map(humans.map((h) => [h.seat, []]));
function push(seat, text, kind, ttl) { const l = messages.get(seat); if (!l) return; if (kind === 'big') for (let i = l.length - 1; i >= 0; i--) if (l[i].kind === 'big') l.splice(i, 1); l.push({ text, kind, ttl }); }
function handle(e) {
  const laps = state.config.laps;
  if (e.type === 'countdown') for (const s of messages.keys()) push(s, String(e.value), 'big', 0.9);
  if (e.type === 'go') for (const s of messages.keys()) push(s, t('hud.go'), 'big', 0.8);
  if (!('carId' in e)) return;
  const car = state.cars[e.carId]; if (!car || car.seat < 0) return;
  if (e.type === 'lap' && e.lap <= laps) push(car.seat, e.lap === laps ? t('hud.lastLap') : t('hud.lapOf', { n: e.lap, total: laps }), 'big', 1.5);
  if (e.type === 'lap' && e.best && e.lap > 2) push(car.seat, `${t('hud.best')} ${formatTicks(e.lapTicks)}`, 'good', 2);
  if (e.type === 'fuel_low') push(car.seat, t('hud.lowFuel'), 'warn', 3);
  if (e.type === 'pit_enter') push(car.seat, t('hud.pitStop'), 'info', 2);
  if (e.type === 'nitro_denied') push(car.seat, t('hud.noNitro'), 'warn', 0.8);
  if (e.type === 'finish') push(car.seat, `${t('hud.finished')} ${e.position}º`, 'big', 4);
}
function tick() { stepRace(state, track, []); for (const e of state.events) handle(e); }
function ageMessages(dt) { for (const l of messages.values()) for (let i = l.length - 1; i >= 0; i--) { l[i].ttl -= dt; if (l[i].ttl <= 0) l.splice(i, 1); } }
for (let i = 0; i < preTicks; i++) { tick(); ageMessages(1 / 60); }
const me = state.cars.find((c) => c.seat === 0);
if (winSeconds >= 0) { me.finished = true; me.position = 1; me.finishTick = state.tick - Math.round(winSeconds * 60); }
const SEG_M = 4 / 200; // metros por unidade de pista
// seg=<n>: o carro do jogador vai para o início do segmento n (ver um marco turístico, um trecho de pista); os outros saem da frente.
// together=1: os outros humanos vão junto (lado a lado, 2 segmentos atrás um do outro) — a legenda dos marcos em cada viewport.
if (q.get('seg') !== null) {
  me.z = (Number(q.get('seg')) * 200) % track.length; me.x = Number(q.get('x') ?? 0);
  for (const c of state.cars) if (c !== me) c.z = (me.z + track.length / 2 + c.id * 300) % track.length;
  if (q.get('together') === '1') for (const c of state.cars) if (c.seat > 0) { c.z = (me.z - c.seat * 400 + track.length) % track.length; c.x = c.seat % 2 ? 0.45 : -0.45; }
}
// car=<id> fora das vistas de carro (V2): o carro do jogador na corrida e na câmera de capô (a folha de cada estilo).
if (carview === null && !showroom && sheet === null && q.get('car')) me.carId = q.get('car');
if (carview !== null || showroom || sheet !== null) {
  for (const c of state.cars) { c.speed = 0; c.nitroTicks = 0; c.skidTicks = 0; c.steerPose = 0; }
  const away = (me.z + track.length / 2) % track.length;
  for (const c of state.cars) if (c !== me) c.z = away;
  if (showroom) {
    // Grade de 13: fileiras de 5, 4 e 4 à frente do carro do jogador (atrás dele os carros somem).
    const rows = [[-0.8, -0.4, 0, 0.4, 0.8], [-0.6, -0.2, 0.2, 0.6], [-0.6, -0.2, 0.2, 0.6]];
    const spare = state.cars.filter((c) => c !== me);
    let k = 0;
    rows.forEach((xs, r) => xs.forEach((x) => {
      const c = k === 0 ? me : spare[k - 1];
      c.carId = styleCars[k]; c.x = x; c.z = (me.z + (r * 9) / SEG_M) % track.length;
      k++;
    }));
  } else {
    me.x = 0;
    const pick = q.get('car') ?? (q.get('body') ? carForBody(q.get('body')) : null);
    if (pick) me.carId = pick;
  }
  if (forceNitro) for (const c of state.cars) c.nitroTicks = 100;
}
// car=<id> sem carview: o carro do jogador 1 na corrida (câmera de corrida, noite com freio, medida do gate)
if (q.get('car') && carview === null && !showroom && sheet === null && !paintSheet && !lookSheet) me.carId = q.get('car');
if (q.get('msg')) { for (const s of messages.keys()) { push(s, q.get('msg'), 'big', 9); push(s, t('hud.lowFuel'), 'warn', 9); push(s, t('hud.pitStop'), 'info', 9); } }

const canvas = document.getElementById('game');
const hud = document.getElementById('hud');
// Carros da arte (src/assets/cars/*.glb), como no jogo: o que vier de arquivo aparece em window.carAssets.
window.carAssets = await loadCarAssets();
// Peças baixadas (src/assets/landmarks/parts/<peça>.glb) e marcos da arte (src/assets/landmarks/<id>.glb), idem: o
// que vier de arquivo aparece em window.landmarkParts e window.landmarkAssets.
window.landmarkParts = await loadLandmarkParts();
window.landmarkAssets = await loadLandmarkAssets();
const renderer = createRenderer(canvas, hud);
// Resolução dinâmica: desligada sob automação (captura reprodutível); `dynres=1` a liga e `dynscale=0.72` fixa o degrau (L2).
if (q.get('dynscale')) { renderer.setDynamicResolution(true); renderer.pinDynamicScale(Number(q.get('dynscale'))); }
// Folha de contato: o renderizador desenha no tamanho de um quadro (5 × 3 na janela) e cada quadro é
// copiado para a folha — 15 vezes menos pixels que desenhar a janela inteira por estilo.
// A folha de pinturas tem 16 quadros (4 × 4); a de estilos, 14 (5 × 3).
const LOOK_GRID = { finish: [3, 2], wheel: [3, 2], wheelall: [3, 3], stripe: [3, 2], rim: [3, 2], flame: [3, 3] };
const SHEET_COLS = paintSheet ? 4 : lookSheet ? (LOOK_GRID[lookSheet] ?? [3, 3])[0] : 5; const SHEET_ROWS = paintSheet ? 4 : lookSheet ? (LOOK_GRID[lookSheet] ?? [3, 3])[1] : 3;
const tileW = Math.floor(innerWidth / SHEET_COLS); const tileH = Math.floor(innerHeight / SHEET_ROWS);
function resize() {
  if (sheet !== null) renderer.resize(tileW, tileH, Number(q.get('dpr') ?? 1));
  else renderer.resize(window.innerWidth, window.innerHeight, Number(q.get('dpr') ?? 1));
}
window.addEventListener('resize', resize); resize();

let frames = 0; let time = 0; let last = performance.now();
const extraCam = carview !== null || showroom || sheet !== null ? new THREE.PerspectiveCamera(38, 1, 0.1, 4000) : null;
const VIEWS = { side: [[-7.6, 1.25, 0.3], [0, 0.55, 0]], rear34: [[5.4, 2.0, 7.0], [0, 0.6, 0.4]], front34: [[-6.4, 1.9, -7.4], [0, 0.6, 0]], rear: [[0, 1.5, 8.6], [0, 0.6, 0]], front: [[0, 1.5, -8.6], [0, 0.6, 0]] };
// Quadros da folha de contato: o carro mais perto, para encher o quadro recortado.
const SHEET_VIEWS = { side: [[-7.6, 1.0, 0.0], [0, 0.6, 0]], rear34: [[4.2, 2.2, 5.2], [0, 0.55, 0.2]], front34: [[-4.4, 2.0, -5.3], [0, 0.55, -0.1]], rear: [[0, 1.6, 6.6], [0, 0.6, 0]] };
const SHOWROOM_VIEWS = { front34: [[-12, 7, -30], [0, 0.4, -9.5]], rear34: [[11, 8, 10], [0, 0.4, -9]], side: [[-22, 4, -9], [0, 0.4, -9]] };
function renderExtra(view, table, x = 0, y = 0, w = sheet !== null ? tileW : innerWidth, h = sheet !== null ? tileH : innerHeight) {
  const gl = renderer.__gl; const scene = renderer.__scene;
  const v = table[view] ?? table.rear34 ?? table.front34;
  extraCam.aspect = w / h; extraCam.updateProjectionMatrix();
  extraCam.position.set(v[0][0], v[0][1], v[0][2]);
  extraCam.lookAt(v[1][0], v[1][1], v[1][2]);
  gl.setViewport(x, y, w, h); gl.setScissor(x, y, w, h);
  gl.render(scene, extraCam);
}
function raceFrame() {
  // cam=high|low|hood|bumper (uma para todos) ou cam=hood,bumper,low,high (por assento): as câmeras selecionáveis (nc/cameras). Padrão: a Alta.
  const camQ = (q.get('cam') ?? 'high').split(',');
  const viewports = humans.map((h) => ({ seat: h.seat, carIndex: state.cars.findIndex((c) => c.seat === h.seat), color: h.color, name: h.name, messages: messages.get(h.seat), camera: camQ[h.seat] ?? camQ[0] }));
  const looks = raceLooks(state.cars, humans);
  if (sheetLook !== undefined && (paintSheet || lookSheet)) looks[state.cars.indexOf(me)] = sheetLook;
  const paints = paintsOfLooks(state.cars, looks);
  const ghost = ghostOn ? { pose: { z: me.z + 420, x: Math.max(-0.9, Math.min(0.9, me.x + 0.35)), speed: me.speed, steerPose: 0, nitro: false }, carId: me.carId, delta: 0.4 } : undefined;
  return { state, track, viewports, options: { quality, showMinimap: q.get('map') !== '0', screenShake: true, reduceEffects: reduceFx, cartoonEffects: cartoonFx }, time, paused: forcePause, coop: humanCount >= 2, showHud: q.get('hud') !== '0' && !extraCam, ghost, paints, looks };
}

/** Folha de contato: cada estilo (e o 2º GT) desenhado com a mesma câmera e copiado para um quadro. */
function renderSheet() {
  let tiles = [...styleCars.map((id, i) => ({ id, label: CAR_BODIES[i] }))];
  const second = CARS.filter((c) => c.body === 'gt')[1];
  if (second) tiles.push({ id: second.id, label: `gt · ${second.name}` });
  const first = CARS.find((c) => c.body === 'gt');
  if (first) tiles[0].label = `gt · ${first.name}`;
  // Folha de pinturas: o mesmo carro nas 16 opções da paleta (a Original primeiro).
  if (paintSheet) tiles = PAINT_IDS.map((id) => ({ id: paintSheet, look: id === 'original' ? null : { paint: id }, label: t(`ui.paint.${id}`) }));
  // Folha de visuais (N3): o mesmo carro variando UM campo do look sobre o look de partida (lookbase).
  if (lookSheet) {
    const base = q.get('lookbase') ? JSON.parse(q.get('lookbase')) : {};
    const car = q.get('car') ?? 'falcao';
    const body = CARS.find((c) => c.id === car)?.body ?? 'gt';
    const options = {
      finish: FINISH_IDS.map((v) => [v, v]), wheel: WHEEL_LISTS[body].map((v) => [v, v]), wheelall: WHEEL_IDS.map((v) => [v, v]),
      stripe: [['auto', undefined], ...STRIPE_IDS.map((v) => [v, v])], rim: [['auto', undefined], ...RIM_IDS.map((v) => [v, v])],
      flame: [['auto', undefined], ...FLAME_IDS.map((v) => [v, v])],
    }[lookSheet] ?? [];
    const field = lookSheet === 'wheelall' ? 'wheel' : lookSheet;
    tiles = options.map(([label, value]) => ({ id: car, look: { ...base, ...(value === undefined ? {} : { [field]: value }) }, label: `${field} · ${label}` }));
  }
  const cols = SHEET_COLS;
  const out = document.getElementById('sheet');
  out.width = innerWidth; out.height = innerHeight;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#0b0d12'; ctx.fillRect(0, 0, out.width, out.height);
  const tw = tileW; const th = tileH;
  tiles.forEach((tile, i) => {
    me.carId = tile.id;
    sheetLook = tile.look ?? null;
    renderer.render(raceFrame());
    renderExtra(sheet, SHEET_VIEWS);
    const x = (i % cols) * tw; const y = Math.floor(i / cols) * th;
    ctx.drawImage(canvas, 0, 0, canvas.width, canvas.height, x, y, tw, th);
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(x, y + th - 26, tw, 26);
    ctx.fillStyle = '#fff'; ctx.font = '600 16px sans-serif'; ctx.fillText(tile.label, x + 8, y + th - 8);
    ctx.strokeStyle = '#0b0d12'; ctx.lineWidth = 2; ctx.strokeRect(x, y, tw, th);
  });
  out.style.display = 'block';
}

window.ready = false;
window.errors = [];
window.addEventListener('error', (e) => window.errors.push(String(e.message)));
function loop(now) {
  const dt = q.get('realtime') === '1' ? Math.min(0.1, (now - last) / 1000) : 1 / 60; last = now; time += dt;
  // seq: 4 quadros de corrida, 4 de fundo de menu, 4 de corrida (o jogo alterna entre os dois).
  const idleNow = idle || (seq && frames >= 4 && frames < 8);
  if (sheet !== null) {
    // Os primeiros quadros aquecem (programas, sombras); o último monta a folha.
    if (frames + 1 >= readyAt) renderSheet(); else renderer.render(raceFrame());
  } else if (!idleNow) {
    if (!forcePause) for (let k = 0; k < speedMul; k++) tick();
    for (const c of state.cars) if (c.seat >= 0) { if (forceNitro || (nitroAt >= 0 && frames >= nitroAt)) c.nitroTicks = 100; if (forceSkid) { c.x = 1.35; c.skidTicks = 6; } }
    // brake=1: o carro do jogador "freia" a cada quadro (só a velocidade cai; parado no lugar) — lanternas de freio.
    if (q.get('brake') === '1') { me.speed = Math.max(400, 5000 - frames * 250); me.collisionCooldown = 0; }
    if (forceDrift) { me.driftDir = forceDrift; me.driftTicks = 30; if (driftLevelForced > 0) me.driftCharge = [45, 100, 160][driftLevelForced - 1]; }
    if (topForced > 0) me.speed = me.stats.topSpeed * topForced;
    if (draftForced) { const lead = state.cars.find((c) => c !== me); if (lead) { lead.z = (me.z + 700) % track.length; lead.x = me.x; lead.speed = lead.stats.topSpeed; } }
    if (hitFrame >= 0) { const top = me.stats.topSpeed; if (frames < hitFrame) { me.speed = top * 0.8; me.collisionCooldown = 0; } else if (frames === hitFrame) { me.speed = top * 0.4; me.collisionCooldown = 20; } else me.collisionCooldown = Math.max(0, 20 - (frames - hitFrame)); }
    ageMessages(dt);
    if (liveFraction >= 0) me.progress = liveFraction * state.config.laps * track.length;
    renderer.render(raceFrame());
    if (extraCam) renderExtra(showroom ? (carview ?? 'front34') : (carview || 'rear34'), showroom ? SHOWROOM_VIEWS : VIEWS);
  } else {
    renderer.renderIdle(Number(q.get('t') ?? 0) + time, track);
  }
  frames++;
  if (frames === readyAt) {
    const info = renderer.__gl.info;
    window.debug = { ...renderer.debugInfo(), geometries: info.memory.geometries, textures: info.memory.textures, programs: (info.programs ?? []).length };
    window.ready = true;
    return;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.nc = { state, track, renderer };
</script></body></html>
