<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>showroom dos marcos (Norte e Nordeste)</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;font:600 13px system-ui,sans-serif}canvas{display:block}
.lbl{position:absolute;color:#fff;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:3px}</style>
</head><body>
<script type="module">
// Folha de contato dos marcos de landmarks/brasil-norte-nordeste.ts: uma célula por modelo, câmera em 3/4
// baixa (como o jogador vê da pista: frente do modelo em +X), enquadrada pela caixa do modelo.
// ?ids=a,b,c&night=1&cols=4&az=0.6&el=0.16&zoom=1
import * as THREE from 'three';
import { LANDMARKS_BRASIL_NORTE_NORDESTE as L } from '../src/render/scenery/landmarks/brasil-norte-nordeste.ts';
import { facadeTextures } from '../src/render/scenery/textures.ts';

const q = new URLSearchParams(location.search);
const ids = (q.get('ids') || Object.keys(L).join(',')).split(',').filter(Boolean);
const night = q.get('night') === '1';
const cols = Number(q.get('cols') ?? Math.ceil(Math.sqrt(ids.length)));
const rows = Math.ceil(ids.length / cols);
const az = Number(q.get('az') ?? 0.62);
const el = Number(q.get('el') ?? 0.14);
const zoom = Number(q.get('zoom') ?? 1);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);

const flat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.86, side: THREE.DoubleSide });
const fac = {};
for (const s of ['office', 'apartment', 'classic', 'house']) {
  const t = facadeTextures(s);
  fac[s] = new THREE.MeshStandardMaterial({ vertexColors: true, map: t.map, emissiveMap: t.light, emissive: '#ffffff', emissiveIntensity: night ? 1.25 : 0, roughness: 0.78, flatShading: true });
}
const mats = { flat, ...fac,
  glow: new THREE.MeshBasicMaterial({ vertexColors: true, color: new THREE.Color().setScalar(night ? 2.0 : 0.95) }),
  beacon: new THREE.MeshBasicMaterial({ vertexColors: true }),
  cone: new THREE.MeshBasicMaterial({ visible: false }), panel: flat };

const WATER = new Set(['jangada', 'barco_regional', 'ponte_aracaju', 'ponte_newton_navarro', 'forte_reis_magos']);
const SAND = new Set(['farol_da_barra', 'arcos_atalaia', 'coqueiral', 'pedra_furada_jeri', 'duna_por_do_sol', 'lagoas_lencois', 'farol_preguicas', 'dunas_jalapao', 'farol_cabo_branco']);
const DRY = new Set(['pedra_furada_capivara', 'pinturas_rupestres', 'serra_espirito_santo', 'tepui']);
const W = innerWidth / cols; const H = innerHeight / rows;

ids.forEach((id, i) => {
  const d = L[id];
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(night ? '#0b1440' : '#8fc8f0');
  const box3 = new THREE.Box3();
  const model = d.build();
  for (const p of model.parts) {
    const mesh = new THREE.Mesh(p.geometry, mats[p.mat]);
    mesh.castShadow = p.mat !== 'glow' && p.mat !== 'beacon'; mesh.receiveShadow = true;
    scene.add(mesh);
    p.geometry.computeBoundingBox(); box3.union(p.geometry.boundingBox);
  }
  const size = box3.getSize(new THREE.Vector3());
  const center = box3.getCenter(new THREE.Vector3());
  const R = Math.max(size.x, size.y, size.z) * 0.5 + 1;
  const gcol = WATER.has(id) ? '#2f7fb0' : SAND.has(id) ? '#e6d2a0' : DRY.has(id) ? '#b89a6a' : '#5aa84a';
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(R * 12, R * 12), new THREE.MeshStandardMaterial({ color: gcol, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.position.set(center.x, 0, center.z); ground.receiveShadow = true; scene.add(ground);
  scene.fog = new THREE.Fog(night ? '#25336b' : '#bfe6ff', R * 3, R * 9);
  scene.add(new THREE.HemisphereLight(night ? '#6f86c8' : '#9fd0ff', '#3a6a2a', night ? 1.1 : 0.8));
  const sun = new THREE.DirectionalLight(night ? '#9fb0ff' : '#fff3d8', night ? 0.5 : 3);
  sun.position.set(center.x + R * 0.8, R * 1.6, center.z + R * 1.1); sun.target.position.copy(center); scene.add(sun.target);
  sun.castShadow = true;
  const sc = sun.shadow.camera; sc.left = -R * 1.3; sc.right = R * 1.3; sc.top = R * 1.3; sc.bottom = -R * 1.3; sc.far = R * 6; sc.updateProjectionMatrix();
  sun.shadow.mapSize.set(2048, 2048); sun.shadow.normalBias = R * 0.002; scene.add(sun);
  const cam = new THREE.PerspectiveCamera(36, W / H, R * 0.02, R * 20);
  const dist = (R / Math.sin((36 * Math.PI / 180) / 2)) * 0.82 / zoom;
  cam.position.set(center.x + Math.cos(az) * Math.cos(el) * dist, Math.max(2, center.y * 0.4 + Math.sin(el) * dist), center.z + Math.sin(az) * Math.cos(el) * dist);
  cam.lookAt(center.x, center.y * 0.8, center.z);
  const cx = (i % cols) * W; const cy = innerHeight - (Math.floor(i / cols) + 1) * H;
  renderer.setViewport(cx, cy, W, H); renderer.setScissor(cx, cy, W, H);
  renderer.render(scene, cam);
  const lbl = document.createElement('div'); lbl.className = 'lbl';
  lbl.style.left = `${(i % cols) * W + 4}px`; lbl.style.top = `${Math.floor(i / cols) * H + 4}px`;
  lbl.textContent = `${id} · ${d.place}`;
  document.body.appendChild(lbl);
});
window.ready = true;
</script></body></html>
