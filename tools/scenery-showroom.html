<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>showroom do cenário</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<script type="module">
import * as THREE from 'three';
import { getModel } from '../src/render/scenery/catalog.ts';
import { facadeTextures, panelAtlas } from '../src/render/scenery/textures.ts';
import { loadLandmarkAssets, loadLandmarkParts } from '../src/render/scenery/landmarks/assets.ts';

// Peças baixadas (src/assets/landmarks/parts/<peça>.glb) e marcos da arte (src/assets/landmarks/<id>.glb), como no
// jogo; nolm=1 mostra só o procedural (sem peças nem marcos de arquivo).
const procedural = new URLSearchParams(location.search).get('nolm') === '1';
window.landmarkParts = procedural ? null : await loadLandmarkParts();
window.landmarkAssets = procedural ? null : await loadLandmarkAssets();

const q = new URLSearchParams(location.search);
const ids = (q.get('ids') ?? '').split(',').filter(Boolean);
const night = q.get('night') === '1';
// flat=1: sombreado plano (como antes das normais suaves), para comparar antes/depois.
const flatShading = q.get('flat') === '1';
const cols = Number(q.get('cols') ?? Math.ceil(Math.sqrt(ids.length)));
const gap = Number(q.get('gap') ?? 9);
const camD = Number(q.get('cam') ?? 1);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(night ? '#0b1440' : '#8fc8f0');
scene.fog = new THREE.FogExp2(night ? '#25336b' : '#bfe6ff', Number(q.get('fog') ?? 0.004));
const hemi = new THREE.HemisphereLight(night ? '#6f86c8' : '#9fd0ff', '#3a6a2a', night ? 1.3 : 0.75); scene.add(hemi);
const sun = new THREE.DirectionalLight(night ? '#9fb0ff' : '#fff3d8', night ? 0.6 : 3); sun.position.set(40, 60, 30); sun.castShadow = true;
const sc = sun.shadow.camera; sc.left = -80; sc.right = 80; sc.top = 80; sc.bottom = -80; sc.far = 300; sc.updateProjectionMatrix();
sun.shadow.mapSize.set(2048, 2048); sun.shadow.normalBias = 0.12; scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(Number(q.get('ground') ?? 600), Number(q.get('ground') ?? 600)), new THREE.MeshStandardMaterial({ color: '#5aa84a', roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const flat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading, roughness: 0.86, side: THREE.DoubleSide });
const fac = {}; for (const s of ['office', 'apartment', 'classic', 'house']) { const t = facadeTextures(s); fac[s] = new THREE.MeshStandardMaterial({ vertexColors: true, map: t.map, emissiveMap: t.light, emissive: '#ffffff', emissiveIntensity: night ? 1.25 : 0, roughness: s === 'office' ? 0.32 : 0.78, metalness: s === 'office' ? 0.35 : 0, flatShading }); }
const atlas = panelAtlas();
const mats = { flat, ...fac, glow: new THREE.MeshBasicMaterial({ vertexColors: true, color: new THREE.Color().setScalar(night ? 2.6 : 0.95) }), beacon: new THREE.MeshBasicMaterial({ vertexColors: true }), cone: new THREE.MeshBasicMaterial({ color: '#ffd98a', transparent: true, opacity: 0.06, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, visible: night }), panel: new THREE.MeshStandardMaterial({ map: atlas, emissiveMap: atlas, emissive: '#fff', emissiveIntensity: night ? 0.55 : 0, side: THREE.DoubleSide }) };
let maxH = 1;
ids.forEach((id, i) => {
  const m = getModel(id);
  const x = (i % cols - (cols - 1) / 2) * gap; const z = Math.floor(i / cols) * gap;
  for (const p of m.parts) {
    const mesh = new THREE.Mesh(p.geometry, mats[p.mat]);
    mesh.position.set(x, 0, -z); mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.rotation.y = Number(q.get('yaw') ?? 0.5);
    scene.add(mesh);
    p.geometry.computeBoundingBox(); maxH = Math.max(maxH, p.geometry.boundingBox.max.y);
  }
});
const rows = Math.ceil(ids.length / cols);
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.5, 8000);
const span = Math.max(cols * gap, rows * gap);
cam.position.set(span * 0.35 * camD, (maxH * 0.9 + span * 0.35) * camD, (span * 0.9 + 6) * camD);
cam.lookAt(0, maxH * 0.35, -rows * gap * 0.45);
renderer.render(scene, cam);
renderer.render(scene, cam);
window.ready = true;
</script></body></html>
